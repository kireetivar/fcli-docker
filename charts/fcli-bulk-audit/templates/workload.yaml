{{- if .Values.schedule.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule.cron | quote }}
  timeZone: {{ .Values.schedule.timeZone | quote }}
  suspend: {{ .Values.schedule.suspend }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: {{ .Values.schedule.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.schedule.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.schedule.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      {{- include "bulk.jobSpec" . | nindent 6 }}
{{- else }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
spec:
  {{- include "bulk.jobSpec" . | nindent 2 }}
{{- end }}
{{- if .Values.network.restrictEgress }}
{{- $ports := list (include "bulk.httpsPort" .Values.audit.sscUrl | trim) (include "bulk.httpsPort" .Values.audit.aviatorUrl | trim) | uniq | sortAlpha }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bulk.name" . }}
  labels:
    {{- include "bulk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "bulk.labels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        {{- include "bulk.egressPeers" . | nindent 8 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        {{- include "bulk.egressPeers" . | nindent 8 }}
      ports:
        {{- range $ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
