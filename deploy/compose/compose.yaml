services:
  bulk-audit:
    image: ${BULK_AUDIT_IMAGE:-fcli-bulk-audit:poc-20261005}
    platform: linux/amd64
    build:
      context: ../../linux
      target: fcli-bulk-audit
      args:
        FCLI_VERSION: ${FCLI_VERSION:-v3.28.0}
        FCLI_SHA256: ${FCLI_SHA256:-f1c272513e24c204abd700037d373b831131520e805b2b8409025e619f8b04f6}
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stop_grace_period: 45s
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 256
    tmpfs:
      - /work:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
      - /tmp:rw,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700
    environment:
      SSC_URL: ${SSC_URL:?Set SSC_URL in .env}
      AVIATOR_URL: ${AVIATOR_URL:?Set AVIATOR_URL in .env}
      AVIATOR_TENANT: ${AVIATOR_TENANT:?Set AVIATOR_TENANT in .env}
      BULK_AUDIT_FILTER: ${BULK_AUDIT_FILTER:-}
      BULK_AUDIT_ACTION: ${BULK_AUDIT_ACTION:-bulkaudit-sast}
      BULK_AUDIT_DRY_RUN: ${BULK_AUDIT_DRY_RUN:-true}
      BULK_AUDIT_MAX_AUDITS: ${BULK_AUDIT_MAX_AUDITS:-1}
      BULK_AUDIT_TIMEOUT_SECONDS: ${BULK_AUDIT_TIMEOUT_SECONDS:-3600}
      BULK_AUDIT_EXCLUDE_FILTER: ${BULK_AUDIT_EXCLUDE_FILTER:-}
    secrets:
      - source: ssc-token
        target: ssc-token
      - source: aviator-token
        target: aviator-token
      - source: aviator-private-key
        target: aviator-private-key
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  ssc-token:
    file: ./secrets/ssc-token
  aviator-token:
    file: ./secrets/aviator-token
  aviator-private-key:
    file: ./secrets/aviator-private-key
