# Apply in the audit namespace after installing External Secrets Operator.
# Give the operator a workload role limited to the selected AWS secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bulk-audit-aws
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulk-audit
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: bulk-audit-aws
    kind: SecretStore
  target:
    name: fcli-bulk-audit-credentials
    creationPolicy: Owner
  data:
    - secretKey: ssc-token
      remoteRef:
        key: fortify/bulk-audit
        property: sscToken
    - secretKey: aviator-token
      remoteRef:
        key: fortify/bulk-audit
        property: aviatorToken
    - secretKey: aviator-private-key
      remoteRef:
        key: fortify/bulk-audit
        property: aviatorPrivateKey
