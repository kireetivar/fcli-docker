# Mount diagnostic storage read-only at /logs in a separate collector.
# Run the collector as UID 10001. Give the collector its own AWS workload role.
# Persist /var/lib/fluent-bit and provision the CloudWatch log group with retention.
[SERVICE]
    Flush         5
    Log_Level     info
    storage.path  /var/lib/fluent-bit/storage

[INPUT]
    Name              tail
    Tag               fcli.diagnostics
    Path              /logs/*/*.log
    Path_Key          log_file
    DB                /var/lib/fluent-bit/fcli.db
    Read_from_Head    On
    Mem_Buf_Limit     10M
    Buffer_Max_Size   1M
    storage.type     filesystem

[OUTPUT]
    Name                     cloudwatch_logs
    Match                    fcli.diagnostics
    region                   ${AWS_REGION}
    log_group_name           ${CLOUDWATCH_LOG_GROUP}
    log_stream_prefix        diagnostics-
    auto_create_group        false
    Retry_Limit              False
    storage.total_limit_size 128M
