name: Build and publish Docker images
on:
  workflow_dispatch:
    inputs: 
      releaseTag:
        description: 'Required fcli release tag for which to build and release Docker images (e.g., v3.14.0)'
        required: true
        type: string
      doPublish:
        description: 'Publish images to Docker Hub'
        required: true
        type: boolean
        default: false
      isLatest:
        description: 'Tag as latest (set by fcli CI when releasing latest version for current major version)'
        required: false
        type: boolean
        default: false
      buildProduction:
        description: 'Build production images (scratch, ubi9, ubi9-sc variants)'
        required: false
        type: boolean
        default: true
      ubiBase:
        description: 'Red Hat UBI base image (default: redhat/ubi9:9.8)'
        required: false
        type: string
        default: 'redhat/ubi9:9.8'
      scClientVersions:
        description: |
          Additional ScanCentral Client versions to build (comma-separated, e.g. "25.4,26.2").
          These are merged with any already-published ubi9-sc versions for this release tag.
          When empty and existing ubi9-sc images are found, only those existing versions are refreshed.
          When empty and no existing ubi9-sc images are found (first publish), the two latest
          YY.Q major versions from the tool definitions are used (each resolved to the latest
          available patch release by fcli at install time).
        required: false
        type: string
        default: ''
      buildTest:
        description: 'Build test images (alpine, windows)'
        required: false
        type: boolean
        default: false
      alpineBase:
        description: 'Alpine base image (default: alpine:3.23.4)'
        required: false
        type: string
        default: 'alpine:3.23.4'
      servercoreVersions:
        description: 'Windows Server Core ltsc versions to build (comma-separated, default: ltsc2022)'
        required: false
        type: string
        default: 'ltsc2022,ltsc2025'

permissions:
  contents: read

concurrency:
  group: docker-release-${{ inputs.releaseTag }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      image_name: ${{ steps.plan.outputs.image_name }}
      linux_sha256: ${{ steps.plan.outputs.linux_sha256 }}
      windows_sha256: ${{ steps.plan.outputs.windows_sha256 }}
      ubi_base: ${{ steps.plan.outputs.ubi_base }}
      alpine_base: ${{ steps.plan.outputs.alpine_base }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
      publish_matrix: ${{ steps.plan.outputs.publish_matrix }}
    steps:
      - uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          persist-credentials: false
      - name: Validate inputs and resolve archive digests
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.releaseTag }}
          DO_PUBLISH: ${{ inputs.doPublish }}
          IS_LATEST: ${{ inputs.isLatest }}
          BUILD_PRODUCTION: ${{ inputs.buildProduction }}
          BUILD_TEST: ${{ inputs.buildTest }}
          UBI_BASE: ${{ inputs.ubiBase }}
          ALPINE_BASE: ${{ inputs.alpineBase }}
          SC_CLIENT_VERSIONS: ${{ inputs.scClientVersions }}
          SERVERCORE_VERSIONS: ${{ inputs.servercoreVersions }}
        run: python3 scripts/release.py

  docker-linux:
    name: Build and test Linux (${{ matrix.name }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.linux_matrix) }}
      fail-fast: false
    steps:
      - uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          persist-credentials: false
      - uses: fortify/shared-github/actions/3rdparty/docker/setup-buildx-action/v3@5ad1afec0f56a21b03f0887eea35505cb6a66554
      - name: Prepare artifact directory
        run: mkdir -p artifact .cache
      - name: Build image
        uses: fortify/shared-github/actions/3rdparty/docker/build-push-action/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          context: linux
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: fcli-candidate:${{ matrix.name }}
          outputs: type=oci,dest=artifact/image.oci.tar
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            FCLI_VERSION=${{ needs.plan.outputs.release_tag }}
            FCLI_SHA256=${{ needs.plan.outputs.linux_sha256 }}
            ALPINE_BASE=${{ needs.plan.outputs.alpine_base }}
            UBI_BASE=${{ needs.plan.outputs.ubi_base }}
            SC_CLIENT_VERSION=${{ matrix.sc_version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Verify and test the exported runtime image
        env:
          IMAGE: fcli-candidate:${{ matrix.name }}
          VARIANT: ${{ matrix.name }}
        run: |
          set -euo pipefail
          skopeo copy --override-os linux --override-arch amd64 \
            oci-archive:artifact/image.oci.tar "docker-archive:.cache/test-image.tar:$IMAGE"
          docker load --input .cache/test-image.tar
          python3 scripts/oci-image.py artifact/image.oci.tar \
            --docker-archive .cache/test-image.tar --image "$IMAGE" > artifact/identity.json
          bash scripts/test-release-image.sh "$IMAGE" "$VARIANT"
      - name: Scan the tested image
        run: bash scripts/scan-image.sh .cache/test-image.tar reports
      - name: Retain scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scan-${{ matrix.name }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
      - name: Retain the verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.name }}
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  docker-windows:
    name: Test Windows (${{ matrix.ltsc }})
    needs: plan
    if: ${{ inputs.buildTest }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.windows_matrix) }}
      fail-fast: false
    steps:
      - uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          persist-credentials: false
      - name: Build and test Windows image
        shell: pwsh
        env:
          LTSC_VERSION: ${{ matrix.ltsc }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          FCLI_SHA256: ${{ needs.plan.outputs.windows_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          docker build windows --target "fcli-$env:LTSC_VERSION" `
            --tag "fcli-windows:$env:LTSC_VERSION" `
            --build-arg "FCLI_VERSION=$env:RELEASE_TAG" `
            --build-arg "FCLI_SHA256=$env:FCLI_SHA256" `
            --build-arg "SERVERCORE_BASE=mcr.microsoft.com/windows/servercore:$env:LTSC_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker run --rm "fcli-windows:$env:LTSC_VERSION" fcli --version
          exit $LASTEXITCODE

  publish:
    name: Promote verified image (${{ matrix.name }})
    needs: [plan, docker-linux, docker-windows]
    if: >-
      ${{ always() && !cancelled() && inputs.doPublish && inputs.buildProduction &&
          needs.docker-linux.result == 'success' &&
          (!inputs.buildTest || needs.docker-windows.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.publish_matrix) }}
      fail-fast: false
    steps:
      - uses: fortify/shared-github/actions/3rdparty/actions/checkout/v6@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-${{ matrix.name }}
          path: artifact
      - name: Verify artifact identity
        run: |
          set -euo pipefail
          python3 scripts/oci-image.py artifact/image.oci.tar > artifact/received.json
          cmp artifact/identity.json artifact/received.json
      - name: Docker login
        uses: fortify/shared-github/actions/3rdparty/docker/login-action/v3@5ad1afec0f56a21b03f0887eea35505cb6a66554
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Promote the original OCI artifact
        env:
          TAGS: ${{ join(matrix.tags, ',') }}
        run: |
          set -euo pipefail
          expected=$(jq -r .index_digest artifact/identity.json)
          IFS=',' read -r -a tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            skopeo copy --all --preserve-digests --digestfile artifact/published.digest \
              oci-archive:artifact/image.oci.tar "docker://$tag"
            test "$(cat artifact/published.digest)" = "$expected"
            printf '%s@%s\n' "${tag%:*}" "$expected" >> "$GITHUB_STEP_SUMMARY"
          done
